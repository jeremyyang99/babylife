<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👶 婴儿生活管家</title>
<style>
/* ====== 复用原版 visionOS Glass 设计系统（精简） ====== */
:root {
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-2xl: 28px;
  --dur: 0.25s; --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --page-bg: #eef1f6; --page-bg2: #dce2ee;
  --modal-overlay-bg: rgba(0,0,0,0.10);
  --lg-glass-bg: rgba(255,255,255,0.18);
  --lg-glass-border: 1px solid rgba(255,255,255,0.28);
  --lg-blur: blur(40px) saturate(160%);
  --lg-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 16px rgba(0,0,0,0.04);
  --thin-bg: rgba(255,255,255,0.22);
  --thin-border: 1px solid rgba(255,255,255,0.32);
  --thin-blur: blur(16px) saturate(140%);
  --thin-shadow: 0 1px 2px rgba(0,0,0,0.01), 0 2px 8px rgba(0,0,0,0.03);
  --regular-bg: rgba(255,255,255,0.28);
  --regular-border: 1px solid rgba(255,255,255,0.35);
  --regular-blur: blur(24px) saturate(150%);
  --regular-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 6px 20px rgba(0,0,0,0.04);
  --clear-bg: rgba(255,255,255,0.14);
  --clear-border: 1px solid rgba(255,255,255,0.18);
  --clear-blur: blur(20px) saturate(130%);
  --clear-shadow: 0 1px 2px rgba(0,0,0,0.03);
  --thick-bg: rgba(255,255,255,0.36);
  --thick-border: 1px solid rgba(255,255,255,0.42);
  --thick-blur: blur(20px) saturate(150%);
  --glass-accent: #5f6775;
  --accent-soft: rgba(95,103,117,0.10);
  --glass-accent-text: #434852;
  --label-primary: rgba(0,0,0,0.90);
  --label-secondary: rgba(0,0,0,0.65);
  --label-tertiary: rgba(0,0,0,0.45);
  --label-quaternary: rgba(0,0,0,0.25);
  --fill-primary: rgba(0,0,0,0.10);
  --fill-secondary: rgba(0,0,0,0.07);
  --glass-green: #34c759; --glass-orange: #ff9f0a;
  --glass-red: #ff453a; --glass-purple: #af52de;
  --border-medium: rgba(0,0,0,0.12);
  --shadow-sm: var(--thin-shadow);
  --shadow-md: var(--regular-shadow);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(145deg, var(--page-bg), var(--page-bg2));
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
}
.app {
  display: grid;
  grid-template-columns: var(--left-width, 220px) 5px 1fr 5px var(--right-width, 420px);
  height: 100vh;
  overflow: hidden;
}
.resizer { background: var(--fill-primary); cursor: col-resize; z-index:10; transition: background 0.15s; position:relative; }
.resizer::after { content:''; position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); width:1px; background:var(--fill-secondary); }
.resizer:hover,.resizer.active { background:var(--glass-accent); width:3px; }
.resizer:hover::after,.resizer.active::after { display:none; }

/* 折叠/展开按钮 */
.collapse-btn, .expand-btn { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border:none; border-radius:50%; background:transparent; color:var(--text-muted); cursor:pointer; font-size:14px; line-height:1; transition:all 0.15s; flex-shrink:0; }
.collapse-btn:hover, .expand-btn:hover { background:var(--fill-primary); color:var(--label-primary); }
.collapsed-strip { display:none; height:100%; backdrop-filter:var(--thin-blur); -webkit-backdrop-filter:var(--thin-blur); background:var(--thin-bg); border:var(--thin-border); border-radius:var(--r-lg); flex-direction:column; align-items:center; justify-content:flex-start; padding-top:16px; overflow:hidden; }
.left-sidebar, .right-panel { position:relative; backdrop-filter:var(--lg-blur); -webkit-backdrop-filter:var(--lg-blur); background:var(--lg-glass-bg); border:var(--lg-glass-border); box-shadow:var(--lg-shadow); display:flex; flex-direction:column; overflow:hidden; transition:width 0.25s ease; }
.left-sidebar { border-right:var(--lg-glass-border); }
.right-panel { border-left:var(--lg-glass-border); }
.left-sidebar.collapsed .sidebar-inner, .right-panel.collapsed .panel-inner { display:none; }
.left-sidebar.collapsed .collapsed-strip, .right-panel.collapsed .collapsed-strip { display:flex; }
.sidebar-inner, .panel-inner { display:flex; flex-direction:column; height:100%; overflow:hidden; }
.sidebar-header { display:flex; flex-direction:column; padding:16px; border-bottom:1px solid var(--fill-primary); flex-shrink:0; min-height:60px; }
.sidebar-brand-row { display:flex; align-items:center; justify-content:space-between; }
.sidebar-brand { font-size:16px; font-weight:700; color:var(--text-primary); line-height:1.3; }
.sidebar-nav { flex:1; overflow-y:auto; padding:8px; }
.nav-item { display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:none; border-radius:var(--r-sm); background:transparent; color:var(--text-secondary); font-size:14px; font-family:inherit; cursor:pointer; transition:all 0.15s; text-align:left; margin-bottom:2px; }
.nav-item:hover { background:linear-gradient(145deg, var(--page-bg), var(--page-bg2)); color:var(--text-primary); }
.nav-item.active { backdrop-filter:var(--thick-blur); -webkit-backdrop-filter:var(--thick-blur); background:var(--thick-bg); border:var(--thick-border); color:var(--glass-accent-text); font-weight:700; border-left:3px solid var(--glass-accent); border-radius:0 var(--r-sm) var(--r-sm) 0; padding-left:9px; box-shadow:var(--thin-shadow); }
.nav-icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }
.nav-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-footer { padding:12px; border-top:1px solid var(--fill-primary); border-radius:var(--r-lg); backdrop-filter:var(--thick-blur); -webkit-backdrop-filter:var(--thick-blur); background:var(--thick-bg); border:var(--thick-border); margin:4px 8px 8px; flex-shrink:0; display:flex; gap:6px; align-items:center; }
.sidebar-footer-btn { width:32px; height:32px; border-radius:50%; border:var(--clear-border); backdrop-filter:var(--clear-blur); -webkit-backdrop-filter:var(--clear-blur); background:var(--clear-bg); color:var(--text-secondary); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.sidebar-footer-btn:hover { background:linear-gradient(145deg, var(--page-bg), var(--page-bg2)); color:var(--text-primary); }

.center-content { display:flex; flex-direction:column; overflow:hidden; background:linear-gradient(145deg, var(--page-bg), var(--page-bg2)); }
.center-header { padding:16px 24px; backdrop-filter:var(--thin-blur); -webkit-backdrop-filter:var(--thin-blur); background:var(--thin-bg); border-bottom:var(--thin-border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; height:60px; }
.center-title { font-size:16px; font-weight:700; color:var(--text-primary); margin:0; line-height:1.3; }
.center-actions { display:flex; gap:8px; align-items:center; }
.center-body { flex:1; overflow-y:auto; padding:16px 24px; }

.right-panel .panel-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:40px 24px; }
.panel-placeholder-icon { font-size:48px; opacity:0.3; }
.panel-placeholder-text { font-size:14px; color:var(--text-muted); text-align:center; line-height:1.6; }
.panel-detail { flex:1; overflow-y:auto; padding:20px; }
.panel-detail-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:8px; }
.panel-detail-header-left { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.panel-detail-module-icon { font-size:24px; flex-shrink:0; }
.panel-detail-title { font-size:16px; font-weight:700; color:var(--text-primary); flex:1; min-width:0; word-break:break-all; }
.panel-detail-close { background:none; border:none; font-size:20px; color:var(--text-muted); cursor:pointer; padding:4px; line-height:1; border-radius:4px; flex-shrink:0; margin-left:8px; }
.panel-detail-close:hover { color:var(--text-primary); background:linear-gradient(145deg, var(--page-bg), var(--page-bg2)); }
.panel-detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.panel-detail-grid-item { display:flex; flex-direction:column; }
.panel-detail-label { font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
.panel-detail-value { font-size:14px; color:var(--text-primary); line-height:1.6; word-break:break-all; }

/* 卡片列表 */
.module-cards { display:flex; flex-direction:column; gap:10px; }
.module-card { background:var(--thin-bg); border:var(--thin-border); border-radius:var(--r-md); padding:14px 16px; cursor:pointer; transition:all var(--dur) var(--ease); box-shadow:var(--thin-shadow); }
.module-card:hover { border:var(--thick-border); box-shadow:var(--regular-shadow); transform:translateY(-2px); }
.module-card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:8px; }
.module-card-title { font-size:14px; font-weight:600; color:var(--text-primary); flex:1; min-width:0; line-height:1.4; word-break:break-all; }
.module-card-meta { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary); flex-wrap:wrap; }
.module-card-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; }
.module-card-footer-left { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--text-secondary); }

/* 按钮 */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:4px; padding:7px 16px; border:var(--clear-border); border-radius:var(--r-xl); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all var(--dur) var(--ease); backdrop-filter:var(--clear-blur); -webkit-backdrop-filter:var(--clear-blur); background:var(--clear-bg); color:var(--label-primary); box-shadow:var(--clear-shadow); white-space:nowrap; }
.btn:hover { background:linear-gradient(145deg, var(--page-bg), var(--page-bg2)); color:var(--text-primary); }
.btn-primary { backdrop-filter:var(--thick-blur); -webkit-backdrop-filter:var(--thick-blur); background:var(--accent-soft); color:var(--glass-accent-text); border:1px solid var(--glass-accent); box-shadow:0 1px 3px rgba(95,103,117,0.08); }
.btn-primary:hover { background:var(--accent-soft); box-shadow:0 2px 12px rgba(95,103,117,0.15); color:var(--glass-accent-text); transform:translateY(-1px); }
.btn-success { backdrop-filter:var(--thick-blur); -webkit-backdrop-filter:var(--thick-blur); background:rgba(52,199,89,0.08); color:var(--glass-green); border:1px solid rgba(52,199,89,0.15); }
.btn-success:hover { background:rgba(52,199,89,0.15); box-shadow:0 2px 12px rgba(52,199,89,0.15); color:var(--glass-green); }
.btn-danger { backdrop-filter:var(--thick-blur); -webkit-backdrop-filter:var(--thick-blur); background:rgba(255,69,58,0.08); color:var(--glass-red); border:1px solid rgba(255,69,58,0.15); }
.btn-danger:hover { background:rgba(255,69,58,0.15); box-shadow:0 2px 12px rgba(255,69,58,0.15); color:var(--glass-red); }
.btn-outline { backdrop-filter:var(--clear-blur); -webkit-backdrop-filter:var(--clear-blur); background:var(--clear-bg); border:var(--clear-border); color:var(--label-secondary); }
.btn-outline:hover { background:linear-gradient(145deg, var(--page-bg), var(--page-bg2)); color:var(--text-primary); }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-xs { padding:2px 8px; font-size:11px; }

/* 表单 */
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:4px; font-weight:500; }
.form-row { display:flex; gap:12px; }
.form-row .form-group { flex:1; }
input, select, textarea { width:100%; padding:8px 12px; background:var(--fill-secondary); border:1px solid var(--fill-primary); border-radius:var(--r-sm); color:var(--label-primary); font-size:13px; font-family:inherit; outline:none; transition:border-color 0.2s, box-shadow 0.2s; }
input:focus, select:focus, textarea:focus { border-color:var(--glass-accent); box-shadow:0 0 0 3px rgba(95,103,117,0.12); }
textarea { resize:vertical; min-height:60px; }

/* 工具条 */
.toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.toolbar-left, .toolbar-right { display:flex; gap:8px; align-items:center; }
.search-input { width:200px; padding:7px 12px; background:var(--thin-bg); border:1px solid var(--fill-primary); border-radius:var(--r-sm); font-size:13px; color:var(--text-primary); outline:none; transition:border-color 0.2s; font-family:inherit; }
.search-input:focus { border-color:var(--glass-accent); box-shadow:0 0 0 3px rgba(95,103,117,0.12); }

/* 模态窗 */
.modal-overlay { display:none; position:fixed; inset:0; background:var(--modal-overlay-bg); z-index:1000; align-items:center; justify-content:center; overflow-y:auto; padding:20px; }
.modal-overlay.active { display:flex; }
.modal { background:var(--thin-bg); backdrop-filter:var(--thin-blur); -webkit-backdrop-filter:var(--thin-blur); border:var(--thin-border); border-radius:var(--r-2xl); padding:24px; position:relative; width:100%; max-width:720px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-md); }
.modal h2 { font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:16px; }
.modal-close-btn { position:absolute; top:12px; right:12px; background:none; border:none; font-size:18px; color:var(--text-muted); cursor:pointer; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background 0.15s, color 0.15s; }
.modal-close-btn:hover { background:var(--fill-primary); color:var(--text-primary); }
.modal-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; margin-top:16px; }

/* 文件上传 */
.upload-zone { border:2px dashed var(--fill-primary); border-radius:var(--r-sm); padding:16px; text-align:center; color:var(--text-muted); font-size:12px; cursor:pointer; transition:all 0.2s; margin-top:6px; }
.upload-zone:hover { border-color:var(--glass-accent); color:var(--glass-accent); background:var(--accent-soft); }
.file-item { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:var(--fill-secondary); border-radius:var(--r-sm); margin-bottom:4px; font-size:12px; }
.file-item .file-info { flex:1; display:flex; align-items:center; gap:6px; overflow:hidden; }
.file-item .file-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-item .file-size { color:var(--text-muted); font-size:10px; flex-shrink:0; }
.file-actions { display:flex; gap:3px; flex-shrink:0; }

/* 统计卡片 */
.stats { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.stat-card { background:var(--thin-bg); border:1px solid var(--fill-primary); border-radius:var(--r-sm); padding:12px 16px; box-shadow:var(--shadow-sm); flex:1; min-width:80px; }
.stat-num { font-size:24px; font-weight:700; color:var(--text-primary); }
.stat-label { font-size:11px; color:var(--text-muted); margin-top:2px; }

/* 空状态 */
.empty-state { text-align:center; padding:48px 24px; color:var(--text-muted); }
.empty-state .icon { font-size:40px; margin-bottom:12px; opacity:0.5; }
.empty-state p { font-size:14px; }

/* 滚动条 */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-medium); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }

/* 暗色主题 */
body.dark {
  --page-bg: #101018; --page-bg2: #181828;
  --modal-overlay-bg: rgba(0,0,0,0.40);
  --lg-glass-bg: rgba(20,20,36,0.55);
  --lg-glass-border: 1px solid rgba(255,255,255,0.06);
  --thin-bg: rgba(30,30,50,0.40);
  --thin-border: 1px solid rgba(255,255,255,0.05);
  --regular-bg: rgba(32,32,52,0.48);
  --regular-border: 1px solid rgba(255,255,255,0.06);
  --clear-bg: rgba(255,255,255,0.05);
  --clear-border: 1px solid rgba(255,255,255,0.08);
  --thick-bg: rgba(46,46,66,0.55);
  --thick-border: 1px solid rgba(255,255,255,0.09);
  --glass-accent: #8a92a3;
  --accent-soft: rgba(138,146,163,0.14);
  --glass-accent-text: #9ca4b3;
  --label-primary: rgba(255,255,255,0.95);
  --label-secondary: rgba(255,255,255,0.70);
  --label-tertiary: rgba(255,255,255,0.50);
  --label-quaternary: rgba(255,255,255,0.25);
  --fill-primary: rgba(255,255,255,0.10);
  --fill-secondary: rgba(255,255,255,0.07);
  --border-medium: rgba(255,255,255,0.12);
}
body.dark .btn-primary { border-color:var(--glass-accent); }
</style>
</head>
<body class="light">
<div class="app">
  <!-- ====== 左侧栏 ====== -->
  <aside class="left-sidebar">
    <div class="collapsed-strip" id="collapsedLeftStrip">
      <button class="expand-btn" onclick="togglePanel('left')" title="展开">→</button>
    </div>
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <div class="sidebar-brand-row">
          <div class="sidebar-brand">👶 婴儿管家</div>
          <button class="collapse-btn" onclick="togglePanel('left')" title="折叠">←</button>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')"><span class="nav-icon">📊</span><span class="nav-label">仪表盘</span></button>
        <button class="nav-item" data-tab="feeding" onclick="switchTab('feeding')"><span class="nav-icon">🍼</span><span class="nav-label">喂养记录</span></button>
        <button class="nav-item" data-tab="sleep" onclick="switchTab('sleep')"><span class="nav-icon">😴</span><span class="nav-label">睡眠记录</span></button>
        <button class="nav-item" data-tab="diaper" onclick="switchTab('diaper')"><span class="nav-icon">🧷</span><span class="nav-label">换尿布</span></button>
        <button class="nav-item" data-tab="temperature" onclick="switchTab('temperature')"><span class="nav-icon">🌡️</span><span class="nav-label">体温记录</span></button>
        <button class="nav-item" data-tab="growth" onclick="switchTab('growth')"><span class="nav-icon">📏</span><span class="nav-label">身高体重</span></button>
        <button class="nav-item" data-tab="vaccine" onclick="switchTab('vaccine')"><span class="nav-icon">💉</span><span class="nav-label">疫苗记录</span></button>
        <button class="nav-item" data-tab="milestone" onclick="switchTab('milestone')"><span class="nav-icon">🌟</span><span class="nav-label">里程碑</span></button>
        <button class="nav-item" data-tab="stats" onclick="switchTab('stats')"><span class="nav-icon">📈</span><span class="nav-label">统计图表</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-footer-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
        <button class="sidebar-footer-btn" onclick="openMigrationModal()" title="数据迁移">📦</button>
        <span style="flex:1;font-size:11px;color:var(--text-muted);text-align:right;" id="storageWidget">📁 0</span>
      </div>
    </div>
  </aside>

  <!-- 左拖拽手柄 -->
  <div class="resizer" id="resizerLeft"></div>

  <!-- ====== 中间栏 ====== -->
  <main class="center-content">
    <div class="center-header">
      <h2 class="center-title" id="centerTitle">仪表盘</h2>
      <div class="center-actions" id="centerActions">
        <button class="btn btn-primary" onclick="openEditModal()">＋ 新建记录</button>
      </div>
    </div>
    <div class="center-body">
      <!-- 统计卡片（仪表盘专用） -->
      <div class="stats" id="stats"></div>
      <!-- 各模块页面容器 -->
      <div id="pageContainer"></div>
    </div>
  </main>

  <!-- 右拖拽手柄 -->
  <div class="resizer" id="resizerRight"></div>

  <!-- ====== 右侧栏 ====== -->
  <aside class="right-panel" id="rightPanel">
    <div class="collapsed-strip" id="collapsedRightStrip">
      <button class="expand-btn" onclick="togglePanel('right')" title="展开">←</button>
    </div>
    <div class="panel-inner">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--fill-primary);flex-shrink:0;min-height:60px;">
        <span style="font-size:16px;font-weight:700;color:var(--text-primary);">详情</span>
        <button class="collapse-btn" onclick="togglePanel('right')" title="折叠右侧栏">→</button>
      </div>
      <div class="panel-placeholder" id="panelPlaceholder">
        <div class="panel-placeholder-icon">👶</div>
        <div class="panel-placeholder-text">从列表中选择一条记录查看详情</div>
      </div>
      <div class="panel-detail" id="panelDetail" style="display:none;"></div>
    </div>
  </aside>
</div>

<!-- ====== 编辑弹窗（通用） ====== -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2 id="editModalTitle">新建记录</h2>
    <button class="modal-close-btn" onclick="closeEditModal()">✕</button>
    <input type="hidden" id="editId">
    <input type="hidden" id="editModule">
    <div id="editForm"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<!-- ====== 数据迁移弹窗（复用原版简化） ====== -->
<div class="modal-overlay" id="migrationModal" onclick="if(event.target===this)closeMigrationModal()">
  <div class="modal" style="max-width:500px;">
    <h2>📦 数据迁移</h2>
    <button class="modal-close-btn" onclick="closeMigrationModal()">✕</button>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">导出当前所有数据（含附件）为 JSON 文件，或导入之前备份的 JSON 文件。</p>
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="exportAllData()">📤 导出全部数据</button>
      <button class="btn btn-success" onclick="document.getElementById('importFileInput').click()">📥 导入 JSON</button>
      <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importAllData(this.files[0])">
    </div>
    <div id="migrationProgress" style="display:none;font-size:12px;color:var(--text-muted);"></div>
  </div>
</div>

<script>
// ============ 数据层 ============
const DB_NAME = 'babycare_db';
const STORE_NAME = 'files';
const CONFIG_STORE = 'config';

// 模块名称与存储键映射
const MODULES = {
  feeding: { key: 'baby_feeding', label: '喂养' },
  sleep: { key: 'baby_sleep', label: '睡眠' },
  diaper: { key: 'baby_diaper', label: '尿布' },
  temperature: { key: 'baby_temp', label: '体温' },
  growth: { key: 'baby_growth', label: '身高体重' },
  vaccine: { key: 'baby_vaccine', label: '疫苗' },
  milestone: { key: 'baby_milestone', label: '里程碑' }
};

// 通用数据存取
function loadData(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e) { return []; }
}
function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}
function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// IndexedDB 附件
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(CONFIG_STORE)) db.createObjectStore(CONFIG_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(data) {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const req = tx.objectStore(STORE_NAME).put(data);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function dbGet(id) {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(id) {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const req = tx.objectStore(STORE_NAME).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function dbGetAll() {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbClear() {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ============ 主题 ============
function setTheme(name) {
  document.body.className = name;
  localStorage.setItem('baby_theme', name);
  const btn = document.querySelector('.sidebar-footer-btn');
  if (btn) btn.textContent = name === 'light' ? '🌙' : '☀';
}
function toggleTheme() {
  const current = localStorage.getItem('baby_theme') || 'light';
  setTheme(current === 'light' ? 'dark' : 'light');
}
(function initTheme() {
  const saved = localStorage.getItem('baby_theme') || 'light';
  setTheme(saved);
})();

// ============ 当前状态 ============
let currentTab = 'dashboard';
let currentRecordId = null;
let editingModule = '';
let tempFiles = [];

// ============ 页面渲染引擎 ============
function switchTab(tab) {
  currentTab = tab;
  // 更新导航高亮
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.querySelector(`.nav-item[data-tab="${tab}"]`);
  if (nav) nav.classList.add('active');

  // 更新标题和操作按钮
  const titles = {
    dashboard: '仪表盘',
    feeding: '🍼 喂养记录',
    sleep: '😴 睡眠记录',
    diaper: '🧷 换尿布',
    temperature: '🌡️ 体温记录',
    growth: '📏 身高体重',
    vaccine: '💉 疫苗记录',
    milestone: '🌟 里程碑',
    stats: '📈 统计图表'
  };
  document.getElementById('centerTitle').textContent = titles[tab] || '婴儿管家';

  // 操作按钮
  const actions = document.getElementById('centerActions');
  if (tab === 'dashboard' || tab === 'stats') {
    actions.innerHTML = '';
  } else {
    actions.innerHTML = `<button class="btn btn-primary" onclick="openEditModal('${tab}')">＋ 新建记录</button>`;
  }

  // 统计卡片（仪表盘专用）
  const statsDiv = document.getElementById('stats');
  if (tab === 'dashboard') {
    renderDashboardStats();
    statsDiv.style.display = 'flex';
  } else {
    statsDiv.style.display = 'none';
  }

  // 渲染列表
  const container = document.getElementById('pageContainer');
  if (tab === 'dashboard') {
    renderDashboard(container);
  } else if (tab === 'stats') {
    renderStats(container);
  } else {
    renderList(tab, container);
  }

  // 关闭右侧详情
  closePanelDetail();
}

// ============ 仪表盘 ============
function renderDashboardStats() {
  const statsDiv = document.getElementById('stats');
  const counts = {};
  for (const [mod, cfg] of Object.entries(MODULES)) {
    const data = loadData(cfg.key);
    counts[mod] = data.length;
  }
  statsDiv.innerHTML = `
    <div class="stat-card"><div class="stat-num">${counts.feeding||0}</div><div class="stat-label">🍼 喂养</div></div>
    <div class="stat-card"><div class="stat-num">${counts.sleep||0}</div><div class="stat-label">😴 睡眠</div></div>
    <div class="stat-card"><div class="stat-num">${counts.diaper||0}</div><div class="stat-label">🧷 尿布</div></div>
    <div class="stat-card"><div class="stat-num">${counts.temperature||0}</div><div class="stat-label">🌡️ 体温</div></div>
    <div class="stat-card"><div class="stat-num">${counts.growth||0}</div><div class="stat-label">📏 生长</div></div>
    <div class="stat-card"><div class="stat-num">${counts.vaccine||0}</div><div class="stat-label">💉 疫苗</div></div>
    <div class="stat-card"><div class="stat-num">${counts.milestone||0}</div><div class="stat-label">🌟 里程碑</div></div>
  `;
}

function renderDashboard(container) {
  const recent = [];
  for (const [mod, cfg] of Object.entries(MODULES)) {
    const data = loadData(cfg.key);
    data.forEach(item => {
      recent.push({ module: mod, label: cfg.label, item, datetime: item.datetime || item.date || '' });
    });
  }
  recent.sort((a,b) => (b.datetime||'').localeCompare(a.datetime||''));
  const latest = recent.slice(0, 10);

  let html = `<div style="margin-bottom:12px;"><h3 style="font-size:14px;font-weight:600;color:var(--text-secondary);">📋 最近活动</h3></div>`;
  if (latest.length === 0) {
    html += `<div class="empty-state"><div class="icon">👶</div><p>还没有记录，开始添加吧！</p></div>`;
  } else {
    html += `<div class="module-cards">`;
    latest.forEach(entry => {
      const item = entry.item;
      const title = item.title || item.name || item.milestone || item.vaccine_name || item.type || '记录';
      const time = entry.datetime || item.date || '';
      html += `<div class="module-card" onclick="showDetail('${entry.module}','${item.id}')">
        <div class="module-card-header">
          <div class="module-card-title">[${entry.label}] ${title}</div>
        </div>
        <div class="module-card-footer">
          <div class="module-card-footer-left"><span style="font-size:12px;color:var(--text-muted);">${time}</span></div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;
}

// ============ 列表渲染 ============
function renderList(module, container) {
  const cfg = MODULES[module];
  if (!cfg) return;
  const data = loadData(cfg.key);
  // 按时间倒序
  data.sort((a,b) => (b.datetime||'').localeCompare(a.datetime||''));

  let html = `<div class="toolbar">
    <div class="toolbar-left">
      <input type="text" class="search-input" id="searchInput_${module}" placeholder="搜索..." oninput="filterList('${module}')">
    </div>
  </div>`;
  if (data.length === 0) {
    html += `<div class="empty-state"><div class="icon">📭</div><p>暂无记录，点击「新建记录」添加</p></div>`;
  } else {
    html += `<div class="module-cards" id="listContainer_${module}">`;
    data.forEach(item => {
      const title = item.title || item.name || item.milestone || item.vaccine_name || item.type || '记录';
      const time = item.datetime || item.date || '';
      html += `<div class="module-card" onclick="showDetail('${module}','${item.id}')" data-search="${title} ${time}">
        <div class="module-card-header"><div class="module-card-title">${title}</div></div>
        <div class="module-card-footer">
          <div class="module-card-footer-left"><span style="font-size:12px;color:var(--text-muted);">${time}</span></div>
          <div class="file-actions" onclick="event.stopPropagation();">
            <button class="btn btn-outline btn-xs" onclick="openEditModal('${module}','${item.id}')">编辑</button>
            <button class="btn btn-danger btn-xs" onclick="deleteRecord('${module}','${item.id}')">删除</button>
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;
}

function filterList(module) {
  const input = document.getElementById(`searchInput_${module}`);
  if (!input) return;
  const q = input.value.toLowerCase().trim();
  const cards = document.querySelectorAll(`#listContainer_${module} .module-card`);
  cards.forEach(card => {
    const text = (card.dataset.search || '').toLowerCase();
    card.style.display = (!q || text.indexOf(q) !== -1) ? '' : 'none';
  });
}

// ============ 详情面板 ============
function showDetail(module, id) {
  currentRecordId = id;
  const cfg = MODULES[module];
  if (!cfg) return;
  const data = loadData(cfg.key);
  const item = data.find(d => d.id === id);
  if (!item) return;

  document.getElementById('panelPlaceholder').style.display = 'none';
  document.getElementById('panelDetail').style.display = 'block';

  let html = `<div class="panel-detail-header-row">
    <div class="panel-detail-header-left">
      <span class="panel-detail-module-icon">${cfg.label}</span>
      <div class="panel-detail-title">${item.title || item.name || item.milestone || item.vaccine_name || item.type || '记录'}</div>
    </div>
    <button class="panel-detail-close" onclick="closePanelDetail()">✕</button>
  </div>`;

  // 动态字段
  const fields = [];
  for (const [key, val] of Object.entries(item)) {
    if (key === 'id' || key === 'files' || key === 'datetime') continue;
    if (val !== undefined && val !== null && val !== '') {
      fields.push({ label: key, value: val });
    }
  }
  // 强制显示时间
  if (item.datetime) fields.unshift({ label: '时间', value: item.datetime });

  html += `<div class="panel-detail-grid">`;
  fields.forEach(f => {
    html += `<div class="panel-detail-grid-item">
      <div class="panel-detail-label">${f.label}</div>
      <div class="panel-detail-value">${f.value}</div>
    </div>`;
  });
  html += `</div>`;

  // 附件
  if (item.files && item.files.length) {
    html += `<div style="margin-top:12px;"><div class="panel-detail-label">附件 (${item.files.length})</div>`;
    html += `<div id="detailFileList"></div></div>`;
  }

  html += `<div style="margin-top:16px;display:flex;gap:6px;">
    <button class="btn btn-outline btn-sm" onclick="openEditModal('${module}','${id}')">编辑</button>
    <button class="btn btn-danger btn-sm" onclick="deleteRecord('${module}','${id}')">删除</button>
  </div>`;

  document.getElementById('panelDetail').innerHTML = html;

  // 加载附件
  if (item.files && item.files.length) {
    renderDetailFiles(item.files);
  }
}

async function renderDetailFiles(fileIds) {
  const container = document.getElementById('detailFileList');
  if (!container) return;
  let html = '';
  for (const fid of fileIds) {
    const f = await dbGet(fid);
    if (!f) continue;
    html += `<div class="file-item">
      <div class="file-info"><span class="file-icon">📄</span><span class="file-name">${f.name}</span><span class="file-size">${(f.size/1024).toFixed(1)}KB</span></div>
      <div class="file-actions">
        <button class="btn btn-outline btn-xs" onclick="previewFile('${fid}')">预览</button>
        <button class="btn btn-outline btn-xs" onclick="downloadFile('${fid}')">下载</button>
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

function closePanelDetail() {
  document.getElementById('panelPlaceholder').style.display = '';
  document.getElementById('panelDetail').style.display = 'none';
  currentRecordId = null;
}

// ============ 编辑弹窗 ============
function openEditModal(module, id) {
  if (!module) {
    // 从当前 tab 推断
    if (currentTab && MODULES[currentTab]) module = currentTab;
    else module = 'feeding';
  }
  editingModule = module;
  const cfg = MODULES[module];
  const isEdit = !!id;

  document.getElementById('editModule').value = module;
  document.getElementById('editId').value = id || '';
  document.getElementById('editModalTitle').textContent = isEdit ? `编辑${cfg.label}记录` : `新建${cfg.label}记录`;

  // 构建表单
  const form = document.getElementById('editForm');
  let html = '';

  // 通用时间字段
  html += `<div class="form-group"><label>时间</label><input type="datetime-local" id="edit_datetime" value="${isEdit ? (loadData(cfg.key).find(d=>d.id===id)?.datetime||'') : ''}"></div>`;

  // 模块特定字段
  const fieldsMap = {
    feeding: [
      { id: 'edit_type', label: '类型', type: 'select', options: ['母乳','配方奶','辅食'] },
      { id: 'edit_amount', label: '量 (ml或克)', type: 'number' },
      { id: 'edit_note', label: '备注', type: 'textarea' }
    ],
    sleep: [
      { id: 'edit_duration', label: '时长 (分钟)', type: 'number' },
      { id: 'edit_quality', label: '睡眠质量', type: 'select', options: ['好','一般','差'] },
      { id: 'edit_note', label: '备注', type: 'textarea' }
    ],
    diaper: [
      { id: 'edit_type', label: '类型', type: 'select', options: ['小便','大便','混合'] },
      { id: 'edit_note', label: '备注', type: 'textarea' }
    ],
    temperature: [
      { id: 'edit_temp', label: '体温 (℃)', type: 'number' },
      { id: 'edit_location', label: '测量部位', type: 'select', options: ['腋下','口腔','肛门'] },
      { id: 'edit_note', label: '备注', type: 'textarea' }
    ],
    growth: [
      { id: 'edit_height', label: '身高 (cm)', type: 'number' },
      { id: 'edit_weight', label: '体重 (kg)', type: 'number' },
      { id: 'edit_head', label: '头围 (cm)', type: 'number' },
      { id: 'edit_note', label: '备注', type: 'textarea' }
    ],
    vaccine: [
      { id: 'edit_vaccine_name', label: '疫苗名称', type: 'text' },
      { id: 'edit_site', label: '接种部位', type: 'text' },
      { id: 'edit_reaction', label: '反应', type: 'text' },
      { id: 'edit_note', label: '备注', type: 'textarea' }
    ],
    milestone: [
      { id: 'edit_milestone', label: '里程碑事件', type: 'text' },
      { id: 'edit_desc', label: '描述', type: 'textarea' },
      { id: 'edit_note', label: '备注', type: 'textarea' }
    ]
  };

  const fields = fieldsMap[module] || [];
  fields.forEach(f => {
    let val = '';
    if (isEdit) {
      const item = loadData(cfg.key).find(d => d.id === id);
      if (item) val = item[f.id.replace('edit_', '')] || '';
    }
    if (f.type === 'select') {
      html += `<div class="form-group"><label>${f.label}</label><select id="${f.id}">`;
      f.options.forEach(opt => {
        html += `<option value="${opt}" ${val===opt?'selected':''}>${opt}</option>`;
      });
      html += `</select></div>`;
    } else if (f.type === 'textarea') {
      html += `<div class="form-group"><label>${f.label}</label><textarea id="${f.id}" rows="2">${val}</textarea></div>`;
    } else {
      html += `<div class="form-group"><label>${f.label}</label><input type="${f.type}" id="${f.id}" value="${val}"></div>`;
    }
  });

  // 附件上传
  html += `<div class="form-group"><label>附件</label>
    <div class="upload-zone" onclick="document.getElementById('editFileInput').click()" ondrop="handleDrop(event)" ondragover="event.preventDefault()">
      📎 点击或拖拽上传文件
    </div>
    <input type="file" id="editFileInput" multiple style="display:none;" onchange="handleFileSelect(event)">
    <div id="editFileList"></div>
  </div>`;

  form.innerHTML = html;

  // 加载已有附件
  tempFiles = [];
  if (isEdit) {
    const item = loadData(cfg.key).find(d => d.id === id);
    if (item && item.files) {
      (async () => {
        for (const fid of item.files) {
          const f = await dbGet(fid);
          if (f) tempFiles.push(f);
        }
        renderTempFiles();
      })();
    }
  }
  renderTempFiles();

  document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('active');
  tempFiles = [];
}

function renderTempFiles() {
  const container = document.getElementById('editFileList');
  if (!container) return;
  if (!tempFiles.length) { container.innerHTML = ''; return; }
  container.innerHTML = tempFiles.map((f, i) => `
    <div class="file-item">
      <div class="file-info"><span class="file-icon">📄</span><span class="file-name">${f.name}</span><span class="file-size">${(f.size/1024).toFixed(1)}KB</span></div>
      <div class="file-actions"><button class="btn btn-danger btn-xs" onclick="removeTempFile(${i})">删除</button></div>
    </div>
  `).join('');
}

function removeTempFile(idx) {
  if (confirm('确定移除该附件？')) {
    tempFiles.splice(idx, 1);
    renderTempFiles();
  }
}

function handleFileSelect(e) {
  const files = e.target.files;
  if (!files.length) return;
  for (const file of files) {
    if (file.size > 20*1024*1024) { alert(`文件 ${file.name} 超过20MB`); continue; }
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataUrl = ev.target.result;
      const fileId = 'file_' + genId();
      await dbPut({ id: fileId, name: file.name, size: file.size, type: file.type, data: dataUrl, uploadedAt: new Date().toISOString() });
      tempFiles.push({ id: fileId, name: file.name, size: file.size, type: file.type, data: dataUrl });
      renderTempFiles();
    };
    reader.readAsDataURL(file);
  }
  e.target.value = '';
}

function handleDrop(e) {
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (!files.length) return;
  for (const file of files) {
    if (file.size > 20*1024*1024) { alert(`文件 ${file.name} 超过20MB`); continue; }
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataUrl = ev.target.result;
      const fileId = 'file_' + genId();
      await dbPut({ id: fileId, name: file.name, size: file.size, type: file.type, data: dataUrl, uploadedAt: new Date().toISOString() });
      tempFiles.push({ id: fileId, name: file.name, size: file.size, type: file.type, data: dataUrl });
      renderTempFiles();
    };
    reader.readAsDataURL(file);
  }
}

// ============ 保存记录 ============
async function saveRecord() {
  const module = document.getElementById('editModule').value;
  const id = document.getElementById('editId').value;
  const cfg = MODULES[module];
  const data = loadData(cfg.key);

  // 收集字段
  const fieldsMap = {
    feeding: ['type','amount','note'],
    sleep: ['duration','quality','note'],
    diaper: ['type','note'],
    temperature: ['temp','location','note'],
    growth: ['height','weight','head','note'],
    vaccine: ['vaccine_name','site','reaction','note'],
    milestone: ['milestone','desc','note']
  };
  const fNames = fieldsMap[module] || [];
  const record = { id: id || genId() };
  record.datetime = document.getElementById('edit_datetime').value || new Date().toISOString().slice(0,16);
  fNames.forEach(f => {
    const el = document.getElementById(`edit_${f}`);
    if (el) record[f] = el.value;
  });

  // 附件
  const fileIds = tempFiles.map(f => f.id);
  record.files = fileIds;

  // 保存附件到 IndexedDB（已经保存过了）
  // 更新数据
  if (id) {
    const idx = data.findIndex(d => d.id === id);
    if (idx !== -1) data[idx] = { ...data[idx], ...record };
  } else {
    data.push(record);
  }
  saveData(cfg.key, data);
  closeEditModal();
  // 刷新当前列表
  switchTab(currentTab);
}

// ============ 删除记录 ============
async function deleteRecord(module, id) {
  if (!confirm('确定要删除这条记录吗？')) return;
  const cfg = MODULES[module];
  const data = loadData(cfg.key);
  const item = data.find(d => d.id === id);
  if (item && item.files) {
    for (const fid of item.files) {
      await dbDelete(fid);
    }
  }
  const newData = data.filter(d => d.id !== id);
  saveData(cfg.key, newData);
  closePanelDetail();
  switchTab(currentTab);
}

// ============ 文件预览与下载 ============
function previewFile(fileId) {
  dbGet(fileId).then(f => {
    if (!f) return;
    const ext = f.name.split('.').pop().toLowerCase();
    if (['png','jpg','jpeg','gif','svg'].includes(ext)) {
      // 图片在新窗口打开
      const w = window.open('', '_blank');
      w.document.write(`<img src="${f.data}" style="max-width:90vw;max-height:90vh;">`);
    } else {
      // 下载
      downloadFile(fileId);
    }
  });
}
function downloadFile(fileId) {
  dbGet(fileId).then(f => {
    if (!f) return;
    const a = document.createElement('a');
    a.href = f.data;
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
}

  </div>

  if (typeof Chart === 'undefined') {

    script.onload = () => drawCharts();

  } else {

function drawCharts() {
  // 喂养数据（按天聚合）
  const feedData = loadData(MODULES.feeding.key);
  const feedCounts = {};
  feedData.forEach(f => {
    const date = f.datetime ? f.datetime.slice(0,10) : '';
    if (date) feedCounts[date] = (feedCounts[date] || 0) + 1;
  });
  const dates = Object.keys(feedCounts).sort();
  const counts = dates.map(d => feedCounts[d]);

  if (document.getElementById('feedingChart') && dates.length) {
    const ctx = document.getElementById('feedingChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: { labels: dates, datasets: [{ label: '喂养次数', data: counts, backgroundColor: '#34c759' }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  // 睡眠时长
  const sleepData = loadData(MODULES.sleep.key);
  const sleepMap = {};
  sleepData.forEach(s => {
    const date = s.datetime ? s.datetime.slice(0,10) : '';
    if (date && s.duration) {
      sleepMap[date] = (sleepMap[date] || 0) + Number(s.duration);
    }
  });
  const sleepDates = Object.keys(sleepMap).sort();
  const sleepDurations = sleepDates.map(d => sleepMap[d]);
  if (document.getElementById('sleepChart') && sleepDates.length) {
    const ctx = document.getElementById('sleepChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: { labels: sleepDates, datasets: [{ label: '睡眠总时长(分钟)', data: sleepDurations, borderColor: '#8b5cf6', fill: false }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  // 身高体重
  const growthData = loadData(MODULES.growth.key);
  growthData.sort((a,b) => (a.datetime||'').localeCompare(b.datetime||''));
  const growthDates = growthData.map(g => g.datetime ? g.datetime.slice(0,10) : '');
  const heights = growthData.map(g => g.height || 0);
  const weights = growthData.map(g => g.weight || 0);
  if (document.getElementById('growthChart') && growthData.length) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: growthDates,
        datasets: [
          { label: '身高 (cm)', data: heights, borderColor: '#0ea5e9', fill: false },
          { label: '体重 (kg)', data: weights, borderColor: '#f59e0b', fill: false }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  // 疫苗列表
  const vacData = loadData(MODULES.vaccine.key);
  const vacContainer = document.getElementById('vaccineList');
  if (vacContainer) {
    if (!vacData.length) {
      vacContainer.innerHTML = '<div style="color:var(--text-muted);">暂无疫苗记录</div>';
    } else {
      vacContainer.innerHTML = vacData.map(v =>
        `<div style="padding:4px 0;border-bottom:1px solid var(--fill-primary);">${v.datetime||''} — ${v.vaccine_name||''} (${v.site||''})</div>`
      ).join('');
    }
  }
}

// ============ 数据迁移 ============
function openMigrationModal() {
  document.getElementById('migrationModal').classList.add('active');
}
function closeMigrationModal() {
  document.getElementById('migrationModal').classList.remove('active');
}

async function exportAllData() {
  const progress = document.getElementById('migrationProgress');
  progress.style.display = 'block';
  progress.textContent = '正在收集数据...';
  // 收集所有模块数据
  const allData = {};
  for (const [mod, cfg] of Object.entries(MODULES)) {
    allData[mod] = loadData(cfg.key);
  }
  // 附件
  const files = await dbGetAll();
  const exportObj = {
    version: '1.0',
    exportTime: new Date().toISOString(),
    data: allData,
    files: files
  };
  const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `婴儿数据备份_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  progress.textContent = '导出完成！';
  setTimeout(() => { progress.style.display = 'none'; }, 2000);
}

async function importAllData(file) {
  if (!file) return;
  const progress = document.getElementById('migrationProgress');
  progress.style.display = 'block';
  progress.textContent = '读取文件中...';
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.version || !data.data) {
      throw new Error('无效的备份文件');
    }
    // 覆盖模式：清空现有数据
    if (!confirm('导入将覆盖当前所有数据（包括附件），确定继续？')) {
      progress.style.display = 'none';
      return;
    }
    progress.textContent = '正在导入数据...';
    // 清空 localStorage 对应键
    for (const mod of Object.keys(MODULES)) {
      localStorage.removeItem(MODULES[mod].key);
    }
    // 写入新数据
    for (const [mod, records] of Object.entries(data.data)) {
      if (MODULES[mod]) {
        saveData(MODULES[mod].key, records);
      }
    }
    // 清空附件并重新写入
    await dbClear();
    if (data.files && data.files.length) {
      for (const f of data.files) {
        await dbPut(f);
      }
    }
    progress.textContent = '导入成功！刷新页面查看。';
    setTimeout(() => { location.reload(); }, 1500);
  } catch (e) {
    progress.textContent = '导入失败：' + e.message;
    setTimeout(() => { progress.style.display = 'none'; }, 3000);
  }
}

// ============ 三栏拖拽（简化） ============
(function() {
  const app = document.querySelector('.app');
  const leftResizer = document.getElementById('resizerLeft');
  const rightResizer = document.getElementById('resizerRight');
  let dragging = null;
  let startX = 0;
  let startLeft = 0, startRight = 0;

  function getWidths() {
    const style = getComputedStyle(app);
    const lw = parseInt(style.getPropertyValue('--left-width'));
    const rw = parseInt(style.getPropertyValue('--right-width'));
    return { left: isNaN(lw) ? 220 : lw, right: isNaN(rw) ? 420 : rw };
  }
  function onMouseDown(side, e) {
    e.preventDefault();
    dragging = side;
    startX = e.clientX;
    const w = getWidths();
    startLeft = w.left;
    startRight = w.right;
    app.classList.add('dragging');
  }
  function onMouseMove(e) {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const MIN = 80, MAX_L = 400, MAX_R = 700;
    if (dragging === 'left') {
      const newLeft = Math.min(MAX_L, Math.max(MIN, startLeft + dx));
      app.style.setProperty('--left-width', newLeft + 'px');
      app.style.gridTemplateColumns = newLeft + 'px 5px 1fr 5px ' + (app.style.getPropertyValue('--right-width') || '420px');
    } else if (dragging === 'right') {
      const newRight = Math.min(MAX_R, Math.max(MIN, startRight - dx));
      app.style.setProperty('--right-width', newRight + 'px');
      app.style.gridTemplateColumns = (app.style.getPropertyValue('--left-width') || '220px') + ' 5px 1fr 5px ' + newRight + 'px';
    }
  }
  function onMouseUp() {
    if (!dragging) return;
    app.classList.remove('dragging');
    dragging = null;
  }
  leftResizer.addEventListener('mousedown', onMouseDown.bind(null, 'left'));
  rightResizer.addEventListener('mousedown', onMouseDown.bind(null, 'right'));
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
})();

function togglePanel(side) {
  const app = document.querySelector('.app');
  if (side === 'left') {
    const sidebar = document.querySelector('.left-sidebar');
    sidebar.classList.toggle('collapsed');
    const w = sidebar.classList.contains('collapsed') ? 40 : 220;
    app.style.setProperty('--left-width', w + 'px');
    app.style.gridTemplateColumns = w + 'px 5px 1fr 5px ' + (app.style.getPropertyValue('--right-width') || '420px');
  } else {
    const panel = document.getElementById('rightPanel');
    panel.classList.toggle('collapsed');
    const w = panel.classList.contains('collapsed') ? 40 : 420;
    app.style.setProperty('--right-width', w + 'px');
    app.style.gridTemplateColumns = (app.style.getPropertyValue('--left-width') || '220px') + ' 5px 1fr 5px ' + w + 'px';
  }
}
